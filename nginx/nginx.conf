# Modelo de nginx.conf — confira os caminhos de certificado na VPS.
# Upstreams via variável + resolver do Docker: o nginx não quebra se um
# container for recriado (ver docs/LICOES-INFRA.md).
events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 10 tentativas de login por minuto por IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name pdp.paivaai.com.br api.pdp.paivaai.com.br admin.paivaai.com.br evolution.paivaai.com.br;
        return 301 https://$host$request_uri;
    }

    # Frontend
    server {
        listen 443 ssl;
        server_name pdp.paivaai.com.br;
        ssl_certificate     /etc/letsencrypt/live/pdp.paivaai.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pdp.paivaai.com.br/privkey.pem;
        location / {
            set $up http://frontend:3000;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API (FastAPI)
    server {
        listen 443 ssl;
        server_name api.pdp.paivaai.com.br;
        ssl_certificate     /etc/letsencrypt/live/pdp.paivaai.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pdp.paivaai.com.br/privkey.pem;
        location /auth/login {
            limit_req zone=login burst=5 nodelay;
            set $up http://backend:8000;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            set $up http://backend:8000;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Painel admin
    server {
        listen 443 ssl;
        server_name admin.paivaai.com.br;
        ssl_certificate     /etc/letsencrypt/live/admin.paivaai.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.paivaai.com.br/privkey.pem;
        location / {
            set $up http://admin:3001;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Evolution API (WhatsApp)
    server {
        listen 443 ssl;
        server_name evolution.paivaai.com.br;
        ssl_certificate     /etc/letsencrypt/live/evolution.paivaai.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/evolution.paivaai.com.br/privkey.pem;
        location / {
            set $up http://evolution-api:8080;
            proxy_pass $up;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
