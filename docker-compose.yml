# PDP — Paiva AI Decision Platform
# Todos os serviços na MESMA rede (default). Isolar o admin em outra rede
# causou 502 antes (ver docs/LICOES-INFRA.md).
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /opt/tiktok-signer:/opt/tiktok-signer
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  admin:
    build: ./admin
    env_file: .env
    environment:
      PORT: "3001"
    depends_on:
      - postgres
    ports:
      - "3001:3001"
    restart: unless-stopped

  evolution-api:
    image: atendai/evolution-api:latest
    env_file: .env
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # reload 15s depois de subir: evita nginx guardar IP velho dos upstreams
    command: /bin/sh -c "nginx -g 'daemon off;' & sleep 15 && nginx -s reload && wait"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - admin
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
